[project]
name = "graphax"
version = "0.0.1"
description = "Graphax is an Automatic Differentiation interpreter written in JAX."
authors = [
    { name = "Jamie Lohoff", email = "jamie.lohoff@gmail.com" },
    { name = "Florian Assmuth", email = "florianassmuth@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
license = { text = "MIT" } # Or other license information
readme = "README.rst" # Path to your README file
requires-python = ">=3.12" # Minimum Python versio
dependencies = [
    "chex>=0.1.90",
    "equinox>=0.13.0",
    "jax>=0.7.1",
    "jaxlib>=0.7.1",
    "matplotlib>=3.10.5",
    "numpy>=2.3.2",
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "scipy>=1.16.1",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
]

[tool.uv.workspace]
members = [
    ".",
]

[dependency-groups]
dev = []
